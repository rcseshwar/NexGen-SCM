
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChain SCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-emerald: #10b981;
            --neon-blue: #3b82f6;
            --deep-void: #050810;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--deep-void);
        }

        /* Futuristic Dark Background */
        .futuristic-dark {
            background-color: var(--deep-void);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
        }

        .glass-hud {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .neon-border-emerald {
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .neon-text-emerald {
            color: var(--neon-emerald);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4));
        }

        @keyframes scan-line {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .scanner-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-emerald), transparent);
            animation: scan-line 3s linear infinite;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Responsive background for mobile */
        .mobile-grid-bg {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
